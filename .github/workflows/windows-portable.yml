name: Windows portable and GitHub release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    branches:
      - master

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  portable-win64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSYS2 and Qt 5
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-qt5-base
            mingw-w64-ucrt-x86_64-qt5-tools
            mingw-w64-ucrt-x86_64-qt5-svg
            mingw-w64-ucrt-x86_64-qt5-imageformats
            mingw-w64-ucrt-x86_64-openssl

      - name: Compile application, 4chan parser and updater
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p portable/plugins portable/updater dist release-assets
          pushd gui
          qmake-qt5 gui.pro
          mingw32-make -j2
          popd
          pushd plugins/parser4chan
          qmake-qt5 parser4chan.pro
          mingw32-make -j2
          popd
          pushd updater
          qmake-qt5 updater.pro
          mingw32-make -j2
          popd
          pushd ci
          qmake-qt5 tls-smoke.pro
          mingw32-make -j2
          qmake-qt5 streaming-smoke.pro
          mingw32-make -j2
          qmake-qt5 video-request-smoke.pro
          mingw32-make -j2
          qmake-qt5 retry-after-smoke.pro
          mingw32-make -j2
          qmake-qt5 thread-move-smoke.pro
          mingw32-make -j2
          qmake-qt5 theme-smoke.pro
          mingw32-make -j2
          qmake-qt5 overview-status-smoke.pro
          mingw32-make -j2
          qmake-qt5 program-info-smoke.pro
          mingw32-make -j2
          qmake-qt5 legacy-runtime-smoke.pro
          mingw32-make -j2
          qmake-qt5 image-codecs-smoke.pro
          mingw32-make -j2
          qmake-qt5 parser-domain-smoke.pro
          mingw32-make -j2
          # Validate parser domains without a network connection.
          ../portable/parser-domain-smoke.exe
          rm -f ../portable/parser-domain-smoke.exe
          # Run against the real Qt widget palette and style while the full
          # MSYS2 runtime (including the offscreen platform plugin) is present.
          if ! QT_QPA_PLATFORM=offscreen ../portable/theme-smoke.exe; then
            cat ../portable/theme-smoke-diagnostics.txt || true
            exit 1
          fi
          rm -f ../portable/theme-smoke.exe
          # Verify the complete status filter categories, fixed manual header
          # widths and that hiding rows leaves their original indexes intact.
          QT_QPA_PLATFORM=offscreen ../portable/overview-status-smoke.exe
          rm -f ../portable/overview-status-smoke.exe
          # Program Information: readable nested labels, horizontal scrolling,
          # first-tab default and session-persistent expanded component groups.
          QT_QPA_PLATFORM=offscreen ../portable/program-info-smoke.exe
          rm -f ../portable/program-info-smoke.exe
          # No user data or Qt5 files may be affected by old-runtime cleanup.
          ../portable/legacy-runtime-smoke.exe
          rm -f ../portable/legacy-runtime-smoke.exe
          popd
          echo "Built executable files:"
          find . -maxdepth 3 -name '*.exe' -o -name 'parser4chan.dll'
          cp -v 4chan-dl-reborn.exe portable/4chan-dl-reborn.exe
          cp -v plugins/parser4chan.dll portable/plugins/parser4chan.dll
          cp -v updater/release/upd4t3r.exe portable/updater/upd4t3r.exe
          test -s portable/4chan-dl-reborn.exe
          test -s portable/plugins/parser4chan.dll
          test -s portable/updater/upd4t3r.exe
          test -s portable/tls-smoke.exe
          test -s portable/streaming-smoke.exe
          test -s portable/video-request-smoke.exe
          test -s portable/retry-after-smoke.exe
          test -s portable/thread-move-smoke.exe

      - name: Bundle the Windows Qt runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          qtplugins="/ucrt64/share/qt5/plugins"
          mkdir -p portable/platforms portable/imageformats
          cp -v "$qtplugins/platforms/qwindows.dll" portable/platforms/
          # Reborn downloads/views GIF, JPEG, PNG and WebP. Keep Qt icon,
          # SVG and TIFF decoders for viewer compatibility. Other bundled
          # formats (ICNS, JP2, MNG, TGA, WBMP) are not used, and each may
          # pull additional large libraries into the portable distribution.
          for codec in qgif qico qjpeg qsvg qtiff qwebp; do
            test -s "$qtplugins/imageformats/${codec}.dll"
            cp -v "$qtplugins/imageformats/${codec}.dll" portable/imageformats/
          done
          # Qt Fusion is built into Qt Widgets. No external styles DLL.

          # Copy the transitive PE dependencies supplied by MSYS2, but not
          # Windows system DLLs. Plugins depend on DLLs in the app root.
          copy_deps() {
            local binary="$1"
            local target="$2"
            local dependency
            while IFS= read -r dependency; do
              if test -s "/ucrt64/bin/$dependency" && ! test -e "$target/$dependency"; then
                cp -v "/ucrt64/bin/$dependency" "$target/"
                copy_deps "/ucrt64/bin/$dependency" "$target"
              fi
            done < <(objdump -p "$binary" | sed -n 's/^[[:space:]]*DLL Name: //p' | tr -d '\r' | sort -u)
          }

          copy_deps portable/4chan-dl-reborn.exe portable
          copy_deps portable/plugins/parser4chan.dll portable
          for plugin in portable/platforms/*.dll portable/imageformats/*.dll; do
            copy_deps "$plugin" portable
          done
          copy_deps portable/updater/upd4t3r.exe portable/updater
          # MSYS2 updated OpenSSL to v4 while this Qt 5.15 build still
          # dynamically looks for the ABI of OpenSSL v3. Bundle the older,
          # signed MSYS2 package's v3 runtime DLLs beside the executable.
          # Keep its SHA256 pinned to prevent a silent supply-chain change.
          openssl3_pkg="mingw-w64-ucrt-x86_64-openssl-3.6.5-1-any.pkg.tar.zst"
          curl -fLsS --retry 3 --retry-delay 2 \
            "https://repo.msys2.org/mingw/ucrt64/$openssl3_pkg" \
            -o "$openssl3_pkg"
          printf '%s  %s\n' \
            '773e021ebad83f14b5c103db467411e8ff064663e1c7e7f730e2be72f4117064' \
            "$openssl3_pkg" | sha256sum -c -
          for dll in libssl-3-x64.dll libcrypto-3-x64.dll; do
            bsdtar -xOf "$openssl3_pkg" "ucrt64/bin/$dll" > "portable/$dll"
            test -s "portable/$dll"
            cp -v "portable/$dll" portable/updater/
            copy_deps "portable/$dll" portable
            copy_deps "portable/updater/$dll" portable/updater
          done
          cp LICENSE portable/LICENSE.txt
          printf '%s\n' \
            "4chan Downloader Reborn v$(sed -n 's/^VERSION = //p' gui/gui.pro) - portable Windows 64-bit" \
            'Extract this ZIP into a NEW folder; do not overwrite your original installation.' \
            'Launch 4chan-dl-reborn.exe. Use Check for Updates for future published versions.' \
            'The update service uses the GitHub repository itsr0b0tninja/fourchan-dl-reborn.' \
            'Only the maintained 4chan parser is bundled; other legacy imageboards are not included.' \
            > portable/PORTABLE-NOTES.txt
          test ! -d portable/styles
          test -s portable/platforms/qwindows.dll
          test -s portable/Qt5Core.dll
          test -s portable/Qt5Network.dll
          test -s portable/updater/Qt5Network.dll
          test -s portable/libssl-3-x64.dll
          test -s portable/libcrypto-3-x64.dll
          test -s portable/updater/libssl-3-x64.dll
          test -s portable/updater/libcrypto-3-x64.dll
          test -s portable/imageformats/qgif.dll
          test -s portable/imageformats/qjpeg.dll
          test -s portable/imageformats/qsvg.dll
          test -s portable/imageformats/qwebp.dll
          test ! -f portable/imageformats/qjp2.dll
          test ! -f portable/imageformats/qmng.dll
          test ! -f portable/imageformats/qicns.dll
          find portable -maxdepth 2 -type f | sort

      - name: Verify bundled SSL is functional on Windows
        shell: pwsh
        run: |
          # Prevent GitHub's build tools from masking missing bundled DLLs.
          $root = (Resolve-Path 'portable').Path
          $env:PATH = "$root;$env:SystemRoot\System32;$env:SystemRoot"
          & "$root\tls-smoke.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Portable Qt TLS smoke test failed (exit code $LASTEXITCODE)."
          }
          Remove-Item "$root\tls-smoke.exe"

      - name: Verify streamed file completion and retry state on Windows
        shell: pwsh
        run: |
          $root = (Resolve-Path 'portable').Path
          $env:PATH = "$root;$env:SystemRoot\System32;$env:SystemRoot"
          & "$root\streaming-smoke.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Streaming file smoke test failed (exit code $LASTEXITCODE)."
          }
          Remove-Item "$root\streaming-smoke.exe"

      - name: Verify 4chan video headers on Windows
        shell: pwsh
        run: |
          $root = (Resolve-Path 'portable').Path
          $env:PATH = "$root;$env:SystemRoot\System32;$env:SystemRoot"
          & "$root\video-request-smoke.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Video request header test failed (exit code $LASTEXITCODE)."
          }
          Remove-Item "$root\video-request-smoke.exe"

      - name: Verify HTTP 429 cooldown policy on Windows
        shell: pwsh
        run: |
          $root = (Resolve-Path 'portable').Path
          $env:PATH = "$root;$env:SystemRoot\System32;$env:SystemRoot"
          & "$root\retry-after-smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "HTTP 429 cooldown test failed: $LASTEXITCODE" }
          Remove-Item "$root\retry-after-smoke.exe"

      - name: Verify thread move path mapping, integrity and rollback on Windows
        shell: pwsh
        run: |
          $root = (Resolve-Path 'portable').Path
          $env:PATH = "$root;$env:SystemRoot\System32;$env:SystemRoot"
          & "$root\thread-move-smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "Thread move test failed: $LASTEXITCODE" }
          Remove-Item "$root\thread-move-smoke.exe"

      - name: Verify curated image codecs load from portable DLLs on Windows
        shell: pwsh
        run: |
          # Do not use Qt/MSYS2 DLLs from the runner when verifying the package.
          $root = (Resolve-Path 'portable').Path
          $env:PATH = "$root;$env:SystemRoot\System32;$env:SystemRoot"
          & "$root\image-codecs-smoke.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Portable image codec test failed: $LASTEXITCODE"
          }
          Remove-Item "$root\image-codecs-smoke.exe"

      - name: Create complete Windows portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'portable/*' -DestinationPath 'dist/4chan-dl-reborn-win64-portable.zip' -Force
          if (-not (Test-Path 'dist/4chan-dl-reborn-win64-portable.zip')) {
            throw 'Complete portable ZIP was not created.'
          }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: 4chan-dl-reborn-win64-portable
          path: portable/
          if-no-files-found: error
          retention-days: 30

      # A new version on master is released only after the Windows build and
      # HTTPS smoke test succeeded. A published tag is never replaced.
      - name: Check version for automatic release
        if: github.ref == 'refs/heads/master'
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $matches = Select-String -Path 'gui/gui.pro' -Pattern '^VERSION\s*=\s*(\d+\.\d+(?:\.\d+)?)\s*$'
          if ($matches.Count -ne 1) { throw 'Expected exactly one VERSION in gui/gui.pro.' }
          $version = $matches[0].Matches[0].Groups[1].Value
          $tag = "v$version"
          $plugin = Get-Content 'plugins/parser4chan/parser4chan.pro' -Raw
          $parserVersion = [regex]::Match($plugin, '_LIB_VERSION.*?(\d+\.\d+\.\d+)').Groups[1].Value
          if (-not $parserVersion) { throw 'Parser version missing.' }
          if ([version]$parserVersion -gt [version]$version) { throw 'Parser version exceeds app.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already published. Leaving the release unchanged."
            'publish=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $latest = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $latest) {
            $latestVersion = $latest.TrimStart('v')
            if ([version]$version -le [version]$latestVersion) {
              Write-Host "Not publishing ${tag}: latest published version is v$latestVersion."
              'publish=false' >> $env:GITHUB_OUTPUT
              exit 0
            }
          }
          'publish=true' >> $env:GITHUB_OUTPUT
          Write-Host "New validated release: $tag"

      - name: Publish validated Windows version to GitHub Releases
        if: github.ref == 'refs/heads/master' && steps.release_check.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REBORN_VERSION: ${{ steps.release_check.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:REBORN_VERSION"
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag"
          $parser = Get-Content 'plugins/parser4chan/parser4chan.pro' -Raw
          $parserVersion = [regex]::Match($parser, '_LIB_VERSION.*?(\d+\.\d+\.\d+)').Groups[1].Value
          $parserBase = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$parserVersion"
          New-Item -ItemType Directory -Force 'release-assets' | Out-Null
          @"
          <updates>
          <win32-qt5>
          <file name="4Chan Downloader Reborn" filename="4chan-dl-reborn.exe" type="executable" version="$env:REBORN_VERSION" source="$base/4chan-dl-reborn.exe" target="4chan-dl-reborn.exe" />
          <file name="4chan parser" filename="parser4chan.dll" type="plugin/parser" version="$parserVersion" source="$parserBase/parser4chan.dll" target="plugins/parser4chan.dll" />
          </win32-qt5>
          </updates>
          "@ | Set-Content -Path 'release-assets/webupdate.xml' -Encoding utf8
          @"
          4Chan Downloader Reborn $tag

          Windows x64 portable package: application, 4chan parser, updater and required runtime.
          Download the complete portable ZIP for a new installation.
          Existing installations can use Check for Updates in the app.
          LICENSE.txt and SHA-256 checksums are provided with this release.

          See CHANGELOG.md for details.
          "@ | Set-Content -Path 'release-assets/release-notes.txt' -Encoding utf8
          Copy-Item portable/4chan-dl-reborn.exe release-assets/
          Copy-Item portable/LICENSE.txt release-assets/LICENSE.txt
          if ($parserVersion -eq $env:REBORN_VERSION) {
            Copy-Item portable/plugins/parser4chan.dll release-assets/
          }
          if (Test-Path 'dist/4chan-dl-reborn-win64-portable.zip') {
            Copy-Item dist/4chan-dl-reborn-win64-portable.zip release-assets/
          }
          Get-ChildItem release-assets -File |
            Where-Object { $_.Name -notin @('release-notes.txt', 'SHA256SUMS.txt') } |
            Sort-Object Name | Get-FileHash -Algorithm SHA256 | ForEach-Object {
              "$($_.Hash)  $($_.Path | Split-Path -Leaf)"
            } | Set-Content -Path release-assets/SHA256SUMS.txt -Encoding ascii
          $assets = @(Get-ChildItem release-assets -File | Where-Object { $_.Name -ne 'release-notes.txt' } | ForEach-Object { $_.FullName })
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "4Chan Downloader Reborn $tag" --notes-file release-assets/release-notes.txt $assets
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish $tag" }

      - name: Create release updater manifest and assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: msys2 {0}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          parser_version="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' plugins/parser4chan/parser4chan.pro | head -1)"
          test -n "$parser_version"
          parser_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$parser_version"
          cat > release-assets/webupdate.xml << EOF
          <updates>
          <win32-qt5>
          <file name="4Chan Downloader Reborn" filename="4chan-dl-reborn.exe" type="executable" version="$version" source="$url/4chan-dl-reborn.exe" target="4chan-dl-reborn.exe" />
          <file name="4chan parser" filename="parser4chan.dll" type="plugin/parser" version="$parser_version" source="$parser_url/parser4chan.dll" target="plugins/parser4chan.dll" />
          </win32-qt5>
          </updates>
          EOF
          if test -f dist/4chan-dl-reborn-win64-portable.zip; then
            cp dist/4chan-dl-reborn-win64-portable.zip release-assets/
          fi
          cp portable/4chan-dl-reborn.exe release-assets/
          cp portable/LICENSE.txt release-assets/LICENSE.txt
          if test "$parser_version" = "$version"; then
            cp portable/plugins/parser4chan.dll release-assets/
          fi
          cat release-assets/webupdate.xml

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The release action needs write access, but ordinary builds do not.
    permissions:
      contents: write
