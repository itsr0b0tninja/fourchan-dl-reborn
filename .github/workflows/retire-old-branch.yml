name: Remove retired experimental branch

on:
  push:
    branches: [development/v0.1-foundation]

permissions:
  contents: write

jobs:
  delete-retired-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Remove development/0.1.1-compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reference="repos/${GITHUB_REPOSITORY}/git/refs/heads/development/0.1.1-compatibility"
          if gh api "$reference" >/dev/null 2>&1; then
            gh api --method DELETE "$reference"
            echo "Deleted retired experimental branch."
          else
            echo "Retired branch is already absent."
          fi
